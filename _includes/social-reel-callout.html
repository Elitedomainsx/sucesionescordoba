{% assign reel = site.data.social.reels[include.reel] %}
<div class="social-reel-card border rounded-3 p-4 my-4">
  <p class="fw-semibold mb-2">¿Preferís una explicación en video?</p>
  <p>{{ reel.summary }}</p>
  <a class="social-reel-link" href="{{ reel.url }}" target="_blank" rel="noopener noreferrer" aria-label="Ver reel en Instagram: {{ reel.title }} — se abre en una pestaña nueva" data-social-channel="instagram" data-social-kind="reel" data-social-location="guide" data-social-content="{{ include.reel }}">{% include social-icon.html channel="instagram" %}<span>Ver nuestro reel: {{ reel.title }}</span></a>
</div>
